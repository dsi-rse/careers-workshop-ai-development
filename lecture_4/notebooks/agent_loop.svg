<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- ===== Left: the message stream ===== -->
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1a1a2e">The messages the agent sees</text>

  <rect x="20" y="45" width="400" height="58" rx="6" fill="#f0f0f0" stroke="#888"/>
  <text x="32" y="66" font-size="13" font-weight="bold" fill="#555">system</text>
  <text x="32" y="86" font-size="12" fill="#333">job, columns of db, tool descriptions, rules</text>

  <rect x="20" y="113" width="400" height="48" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="32" y="134" font-size="13" font-weight="bold" fill="#2e7d32">user</text>
  <text x="32" y="152" font-size="12" fill="#333">"Which candidates scored 90 or above?"</text>

  <rect x="60" y="171" width="360" height="48" rx="6" fill="#f3e8fb" stroke="#7b3fa0"/>
  <text x="72" y="192" font-size="13" font-weight="bold" fill="#7b3fa0">assistant</text>
  <text x="72" y="210" font-size="12" font-family="Menlo, Consolas, monospace" fill="#333">{"tool": "...", "arguments": {...}}</text>

  <rect x="20" y="229" width="400" height="48" rx="6" fill="#fff4e5" stroke="#d9822b"/>
  <text x="32" y="250" font-size="13" font-weight="bold" fill="#d9822b">user <tspan font-weight="normal" fill="#777">(really the tool, not the HR person)</tspan></text>
  <text x="32" y="268" font-size="12" font-family="Menlo, Consolas, monospace" fill="#333">TOOL RESULT: ...</text>

  <rect x="60" y="287" width="360" height="40" rx="6" fill="#f3e8fb" stroke="#7b3fa0" stroke-dasharray="5,4"/>
  <text x="72" y="312" font-size="13" fill="#7b3fa0">assistant  ... and so on, until respond</text>

  <text x="20" y="360" font-size="12" fill="#555">Each iteration adds one assistant message (the tool call)</text>
  <text x="20" y="378" font-size="12" fill="#555">and one user message (the tool's result). The system prompt</text>
  <text x="20" y="396" font-size="12" fill="#555">tells the agent that "TOOL RESULT:" messages come from tools.</text>

  <!-- ===== Right: the loop ===== -->
  <text x="490" y="30" font-size="16" font-weight="bold" fill="#1a1a2e">The loop inside ask(prompt)</text>

  <rect x="540" y="50" width="300" height="52" rx="8" fill="#f3e8fb" stroke="#7b3fa0" stroke-width="1.5"/>
  <text x="690" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">AGENT_MODEL chooses</text>
  <text x="690" y="91" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#333">{"tool", "arguments"}</text>

  <rect x="540" y="130" width="300" height="38" rx="8" fill="#ffffff" stroke="#555"/>
  <text x="690" y="154" text-anchor="middle" font-size="13" fill="#333">print iteration, tool, arguments</text>
  <line x1="690" y1="102" x2="690" y2="126" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="690,195 790,240 690,285 590,240" fill="#fdf6e3" stroke="#b58900" stroke-width="1.5"/>
  <text x="690" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">tool ==</text>
  <text x="690" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">"respond"?</text>
  <line x1="690" y1="168" x2="690" y2="191" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- yes branch -->
  <line x1="690" y1="285" x2="690" y2="331" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="312" font-size="12" font-weight="bold" fill="#2e7d32">yes</text>
  <rect x="560" y="335" width="260" height="62" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="690" y="360" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#333">db.query(where)[select]</text>
  <text x="690" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">return it: done!</text>

  <!-- no branch -->
  <line x1="790" y1="240" x2="836" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="806" y="232" font-size="12" font-weight="bold" fill="#c0392b">no</text>
  <rect x="840" y="200" width="110" height="80" rx="8" fill="#fff4e5" stroke="#d9822b" stroke-width="1.5"/>
  <text x="895" y="225" text-anchor="middle" font-size="12" fill="#333">run the tool,</text>
  <text x="895" y="243" text-anchor="middle" font-size="12" fill="#333">append both</text>
  <text x="895" y="261" text-anchor="middle" font-size="12" fill="#333">messages</text>
  <path d="M895,200 L895,76 L844,76" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="490" y="430" font-size="12" fill="#555">With only respond in TOOL_REGISTRY, the loop always ends after one iteration</text>
  <text x="490" y="448" font-size="12" fill="#555">(unless the query fails, in which case the error is sent back and it tries again).</text>
</svg>
