<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="340" fill="#ffffff"/>

  <!-- Inputs -->
  <rect x="20" y="40" width="190" height="70" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="115" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">134 resumes</text>
  <text x="115" y="92" text-anchor="middle" font-size="13" fill="#444">the original resume text</text>

  <rect x="20" y="140" width="190" height="70" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="115" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Lecture 3 scores</text>
  <text x="115" y="192" text-anchor="middle" font-size="13" fill="#444">lecture_3_scores.csv</text>

  <!-- Database -->
  <rect x="270" y="110" width="210" height="130" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="1.5"/>
  <text x="375" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">db (DataFrame)</text>
  <line x1="285" y1="150" x2="465" y2="150" stroke="#b58900" stroke-width="1"/>
  <text x="290" y="172" font-size="13" fill="#333">index: resume_id</text>
  <text x="290" y="194" font-size="13" fill="#333">score</text>
  <text x="290" y="216" font-size="13" fill="#333">score_reasoning</text>
  <text x="290" y="234" font-size="12" font-style="italic" fill="#888">+ columns added by augment</text>

  <line x1="210" y1="175" x2="266" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M210,75 Q240,75 240,120 L240,140 Q240,150 266,150" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="225" y="62" font-size="11" fill="#777">(text read by augment)</text>

  <!-- HR question -->
  <rect x="560" y="20" width="200" height="56" rx="28" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="660" y="44" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">HR question</text>
  <text x="660" y="63" text-anchor="middle" font-size="12" fill="#444">ask("Who has a master's?")</text>

  <!-- Agent loop -->
  <rect x="540" y="115" width="240" height="120" rx="8" fill="#f3e8fb" stroke="#7b3fa0" stroke-width="1.5"/>
  <text x="660" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Agent loop</text>
  <text x="660" y="166" text-anchor="middle" font-size="13" fill="#333">LLM picks a tool from</text>
  <text x="660" y="184" text-anchor="middle" font-size="13" fill="#333">TOOL_REGISTRY, again and</text>
  <text x="660" y="202" text-anchor="middle" font-size="13" fill="#333">again, until it calls respond</text>
  <path d="M780,150 C830,150 830,200 784,200" fill="none" stroke="#7b3fa0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="660" y1="76" x2="660" y2="111" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="536" y1="160" x2="484" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="484" y1="195" x2="536" y2="195" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="152" text-anchor="middle" font-size="11" fill="#777">read</text>
  <text x="510" y="212" text-anchor="middle" font-size="11" fill="#777">write</text>

  <!-- Output -->
  <rect x="560" y="270" width="200" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="660" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Response DataFrame</text>
  <text x="660" y="313" text-anchor="middle" font-size="12" fill="#444">selected rows and columns</text>
  <line x1="660" y1="235" x2="660" y2="266" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="820" y="270" width="120" height="56" rx="28" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="880" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Human</text>
  <text x="880" y="313" text-anchor="middle" font-size="12" fill="#444">makes the decision</text>
  <line x1="760" y1="298" x2="816" y2="298" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
